<style>
    /* Center the sign-up container */
    body {
        font-family: 'Roboto', Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh; /* Full viewport height */
        margin: 0;
        background-color: #f4f4f4; /* Optional: Background color */
    }

    .signup-container {
        max-width: 400px;
        width: 100%;
        padding: 20px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .signup-container h2 {
        font-size: 24px;
        margin-bottom: 20px;
        color: #333;
    }

    .signup-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .form-group label {
        margin-bottom: 5px;
        font-weight: bold;
    }

    .form-group input,
    .form-group select {
        padding: 8px 10px;
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
    }

    .btn-submit {
        padding: 10px;
        background-color: #007bff;
        color: white;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .btn-submit:hover {
        background-color: #0056b3;
    }

    .notification {
        margin-top: 20px;
        padding: 10px;
        background-color: #ffcccc;
        color: #d8000c;
        border: 1px solid #d8000c;
        border-radius: 4px;
        font-size: 14px;
    }
</style>

<div class="signup-container">
    {% block content %}
    <h2>Sign Up</h2>
    <form action="{{ url_for('auth.signup') }}" method="post" class="signup-form">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="name" name="name" required/>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" name="email" required/>
        </div>
        <div class="form-group">
            <label for=""password>Password</label>
            <input type="password" name="password" required/>
        </div>
        <div class="form-group">
            <label for=""password_repeat">Repeat Password</label>
            <input type="password" name="password_repeat" required/>
        </div>
        <div>
            <label>
                <input type="checkbox" name="mailing_list"/>
                Subscribe to mailing list
            </label>
        </div>
        <div>
            <input type="submit" value="Sign Up" class="btn-submit"/>
        </div>
    </form>

    <h3>Already have an account? <a href="{{ url_for('auth.login') }}">LOGIN</a></h3>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="notification">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% endblock %}
</div>
