<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pickadate.js/3.6.4/compressed/themes/classic.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pickadate.js/3.6.4/compressed/themes/classic.date.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pickadate.js/3.6.4/compressed/themes/classic.time.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pickadate.js/3.6.4/compressed/picker.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pickadate.js/3.6.4/compressed/picker.date.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pickadate.js/3.6.4/compressed/picker.time.js"></script>

<style>
    /* Center the sign-up container */
    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh; /* Full viewport height */
        margin: 0;
        background-color: #f4f4f4; /* Optional: Background color */
    }

    .create-event-container {
        min-width: 400px;
        max-width: 600px;
        padding: 20px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .create-event-container h2 {
        font-size: 24px;
        margin-bottom: 20px;
        color: #333;
    }

    .create-event-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .form-group label {
        margin-bottom: 5px;
        font-weight: bold;
    }

    .form-group input,
    .form-group select {
        padding: 8px 10px;
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
    }

    .btn-submit {
        padding: 10px;
        background-color: #007bff;
        color: white;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .btn-submit:hover {
        background-color: #0056b3;
    }

    .notification {
        margin-top: 20px;
        padding: 10px;
        background-color: #ffcccc;
        color: #d8000c;
        border: 1px solid #d8000c;
        border-radius: 4px;
        font-size: 14px;
    }
</style>
</head>


{% extends "base.html" %}

<body>
    {% block content %}
    <div class="create-event-container">
        <h2>Create an Event</h2>
        <form action="{{ url_for('main.create_event') }}" method="post" class="create-event-form">
            <div class="form-group">
                <label for="title">Event Title:</label>
                <input type="title" name="title" required/>
            </div>
            <div class="form-group">
                <label for="location">Location:</label>
                <input type="location" name="location" required/>
            </div>

            <!--TODO: change time picker to a scroll-style like pickadate.js-->
            <div class="form-group">
                <label for="start-date">Start Date:</label>
                <input type="text" id="start-date" name="start-date">
                <label for="start-time">Start Time:</label>
                <input type="text" id="start-time" name="start-time">
            </div>
            <div class="form-group">
                <label for="end-date">End Date:</label>
                <input type="text" id="end-date" name="end-date">
                <label for="end-time">End Time:</label>
                <input type="text" id="end-time" name="end-time">
            </div>
            <div>
                <input type="submit" value="Create" class="btn-submit"/>
            </div>
        </form>

        <script>
            $(document).ready(function(){
                $('#start-date').pickadate({
                    format: 'mmmm d, yyyy', // e.g., October 1, 2023
                    min: new Date() // Minimum date is today
                });

                $('#start-time').pickatime({
                    format: 'h:i A',  // 12-hour format with AM/PM
                    interval: 15,       // Time interval steps in minutes
                    min: undefined,        // Starting at 00:00 AM
                    max: undefined       // Ending at 11:45 PM
                });

                $('#end-date').pickadate({
                    format: 'mmmm d, yyyy', // e.g., October 1, 2023
                    min: new Date() // Minimum date is today
                });

                $('#end-time').pickatime({
                    format: 'h:i A',  // 12-hour format with AM/PM
                    interval: 15,       // Time interval steps in minutes
                    min: undefined,        // Starting at 00:00 AM
                    max: undefined       // Ending at 11:45 PM
                });
            });
        </script>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="notification">{{ message }}</div>
            {% endfor %}
        {% endwith %}
    </div>
    {% endblock %}
</body>
